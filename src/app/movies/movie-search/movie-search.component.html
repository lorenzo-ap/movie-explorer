<form role="search" class="flex gap-2" (submit)="onSubmit($event, searchInput.value)">
  <input
    #searchInput
    type="search"
    placeholder="Search movies..."
    aria-label="Search movies"
    class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-900 px-4 py-2 text-white placeholder:text-slate-500 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 focus:outline-none"
    [value]="query()"
    (input)="onInput(searchInput.value)"
  />
  <button
    type="submit"
    class="rounded-lg bg-amber-400 px-5 py-2 font-semibold text-slate-950 transition hover:bg-amber-300 focus-visible:ring-2 focus-visible:ring-amber-200 focus-visible:outline-none"
  >
    Search
  </button>
</form>
