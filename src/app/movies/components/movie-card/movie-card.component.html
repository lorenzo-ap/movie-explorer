<a
  [routerLink]="['/movie', movie().id]"
  class="group flex h-full flex-col overflow-hidden rounded-xl bg-slate-900 ring-1 ring-slate-800 transition hover:-translate-y-1 hover:ring-amber-400 focus-visible:ring-2 focus-visible:ring-amber-400 focus-visible:outline-none"
>
  <div class="aspect-2/3 bg-slate-800">
    @if (posterUrl(); as url) {
      <img [src]="url" [alt]="movie().title" loading="lazy" class="h-full w-full object-cover" />
    } @else {
      <div class="flex h-full items-center justify-center text-sm text-slate-500">No poster</div>
    }
  </div>

  <div class="flex flex-1 flex-col gap-2 p-4">
    <h2 class="line-clamp-2 font-semibold text-white group-hover:text-amber-400">
      {{ movie().title }}
    </h2>

    <p class="line-clamp-3 text-sm text-slate-400">
      {{ movie().overview || 'No description available.' }}
    </p>
  </div>
</a>
