<h1 class="mb-6 text-2xl font-bold text-white sm:text-3xl">Popular movies</h1>

@if (loading()) {
  <div class="flex justify-center py-20" role="status" aria-label="Loading">
    <div
      class="h-10 w-10 animate-spin rounded-full border-4 border-slate-700 border-t-amber-400"
    ></div>
  </div>
} @else if (error(); as message) {
  <p
    class="rounded-lg border border-red-500/30 bg-red-500/10 p-4 text-center text-red-400"
    role="alert"
  >
    {{ message }}
  </p>
} @else {
  <ul class="grid grid-cols-2 gap-4 sm:grid-cols-3 sm:gap-6 lg:grid-cols-4 xl:grid-cols-5">
    @for (movie of movies(); track movie.id) {
      <li>
        <app-movie-card [movie]="movie" />
      </li>
    } @empty {
      <li class="col-span-full py-20 text-center text-slate-400">No movies found.</li>
    }
  </ul>
}
