@if (totalPages() > 1) {
  <nav class="mt-10 flex items-center justify-center gap-4" aria-label="Pagination">
    <button
      type="button"
      class="rounded-lg border border-slate-700 px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-amber-400 hover:text-amber-400 disabled:pointer-events-none disabled:opacity-40"
      [disabled]="currentPage() <= 1"
      (click)="pageChange.emit(currentPage() - 1)"
    >
      Previous
    </button>

    <span class="text-sm text-slate-400">Page {{ currentPage() }} of {{ totalPages() }}</span>

    <button
      type="button"
      class="rounded-lg border border-slate-700 px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-amber-400 hover:text-amber-400 disabled:pointer-events-none disabled:opacity-40"
      [disabled]="currentPage() >= totalPages()"
      (click)="pageChange.emit(currentPage() + 1)"
    >
      Next
    </button>
  </nav>
}
